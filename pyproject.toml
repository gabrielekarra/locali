[project]
name = "locali"
version = "0.1.0"
description = "Run DeepSeek V4 Flash locally by streaming routed experts from SSD under a hard memory ceiling."
requires-python = "==3.12.*"
dependencies = [
    "mlx",
    "mlx-lm",
    "numpy",
    "psutil",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
